<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Request - FoodShare+</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <style>
    body.request-page {
      background: url('/static/asset/bg3.png') no-repeat center top;
      background-size: cover;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      color: #333;
    }
    .request-container {
      width: 650px;
      margin: 1rem auto;
      padding-top: 8rem;
      background: none;
      box-shadow: none;
    }
    .request-title {
      color: #e0a628;
      font-size: 3rem;
      margin-bottom: 1.5rem;
      font-weight: bold;
      text-transform: uppercase;
      text-align: center;
    }
    .request-form {
      display: flex;
      flex-direction: column;
      gap: 2rem;
      font-size: 1.2rem;
    }
    .form-row {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .form-row label {
      max-width: 200px;
      text-align: left;
      text-transform: uppercase;
      font-weight: bold;
    }
    .form-row input,
    .form-row textarea {
      flex: 1;
      padding: 0.8rem;
      border-radius: 4px;
      border: 1px solid #ccc;
      font-size: 1.1rem;
    }
    .form-row textarea {
      resize: vertical;
    }
    .submit-request {
      display: block;
      margin: 0.7rem auto 0;
      background-color: #e0a628;
      color: #fff;
      padding: 1rem 2.5rem;
      border: none;
      border-radius: 4px;
      font-size: 1.2rem;
      font-weight: bold;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    .submit-request:hover {
      background-color: #c69024;
    }
  </style>
</head>
<body class="request-page">
  <header>
    <div class="header-container">
      <div class="logo">
        <img src="/static/asset/logo.png" alt="FoodShare+ Logo" />
        <h1>FoodShare+</h1>
      </div>
      <nav>
        <ul>
          <li><a href="/home">Home</a></li>
          <li><a href="/donate">Donate</a></li>
          <li><a href="/request" class="active">Request</a></li>
          <li><a href="/listings">Listings</a></li>
          <li><a href="/profile">Profile</a></li>
          <li><a href="/logout">Logout</a></li>
        </ul>
      </nav>
    </div>
  </header>
  <main class="request-container">
    <h1 class="request-title">Request</h1>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flash-messages">
          {% for category, message in messages %}
            <p class="flash {{ category }}">{{ message }}</p>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}
    <form class="request-form" method="POST" action="/request" enctype="multipart/form-data">
      <div class="form-row">
        <label for="requester-name">Name:</label>
        <input type="text" id="requester-name" name="requester-name" value="{{ form.get('requester-name', '') if form else '' }}" required />
      </div>
      <div class="form-row">
        <label for="contact">Contact:</label>
        <input type="text" id="contact" name="contact" value="{{ form.get('contact', '') if form else '' }}" required />
      </div>
      <div class="form-row">
        <label for="type-request">Type of Request:</label>
        <input type="text" id="type-request" name="type-request" value="{{ form.get('type-request', '') if form else '' }}" required />
      </div>
      <div class="form-row">
        <label for="quantity">Quantity:</label>
        <input type="number" id="quantity" name="quantity" min="1" value="{{ form.get('quantity', '') if form else '' }}" required />
      </div>
      <div class="form-row">
        <label for="urgency">Urgency Level:</label>
        <input type="text" id="urgency" name="urgency" value="{{ form.get('urgency', '') if form else '' }}" />
      </div>
      <div class="form-row">
        <label for="special">Special Requirement:</label>
        <textarea id="special" name="special" rows="2">{{ form.get('special', '') if form else '' }}</textarea>
      </div>
      <div class="form-row">
        <label for="image-upload">Image:</label>
        <input type="file" id="image-upload" name="image-upload" accept=".gif,.jpg,.jpeg,.png,.webp,image/*" />
      </div>
      <button type="submit" class="submit-request">Submit Request</button>
    </form>
  </main>
</body>
</html>
